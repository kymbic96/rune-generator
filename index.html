<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Генератор Рунических Карточек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #1a1a1e;
      --card-bg: #26262b;
      --accent-color: #3b82f6;
      --accent-green: #22c55e;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); padding: 12px; padding-bottom: 40px; }

    #auth-error {
      display: none;
      text-align: center;
      padding: 40px 15px;
      color: #ef4444;
      font-weight: bold;
      font-size: 18px;
    }

    .container { max-width: 540px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: bold; margin: 14px 0 8px 0; color: #93c5fd; text-transform: uppercase; letter-spacing: 0.5px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 8px 4px; background: #1e1e24; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-muted); cursor: pointer; font-size: 12px; }
    .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .slider-header { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    .slider-val { color: #60a5fa; font-weight: bold; }

    select, input[type="text"] {
      width: 100%; padding: 10px; background: #16161a; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; margin-top: 4px; outline: none;
    }
    input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--accent-color); }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button.action-btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--accent-color); color: #fff; font-weight: bold; font-size: 13px; cursor: pointer; transition: opacity 0.2s;
    }
    button.action-btn:active { opacity: 0.8; }
    button.action-btn.secondary { background: #374151; }
    button.action-btn.green { background: var(--accent-green); font-size: 15px; padding: 14px; }

    .preview-box { display: flex; justify-content: center; margin: 15px 0; }
    #previewCanvas {
      width: 225px; height: 400px;
      background: #000; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div id="auth-error">⛔ Доступ ограничен.<br><br>Ваш ID не найден в белом списке.</div>

  <div class="container" id="app-container" style="display: none;">
    
    <div class="preview-box">
      <canvas id="previewCanvas" width="1080" height="1920"></canvas>
    </div>

    <!-- 1. Настройка Рун -->
    <div class="section-title">1. Выбор, масштаб и положение рун</div>
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchRuneTab(0)">Руна 1 (Верх)</button>
        <button class="tab-btn" onclick="switchRuneTab(1)">Руна 2 (Центр)</button>
        <button class="tab-btn" onclick="switchRuneTab(2)">Руна 3 (Низ)</button>
      </div>

      <div id="rune-tabs-wrapper"></div>
      
      <button class="action-btn secondary" style="width: 100%; margin-top: 10px;" onclick="resetAllRunes()">↺ Сбросить параметры всех рун</button>
    </div>

    <!-- 2. Фон -->
    <div class="section-title">2. Задний фон</div>
    <div class="card">
      <input type="text" id="bg-url" placeholder="Вставьте прямую ссылку на фото..." oninput="updateBgFromUrl()">
      <div class="btn-row">
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
        <button class="action-btn" onclick="document.getElementById('file-input').click()">📁 Загрузить файл с устройства</button>
      </div>
    </div>

    <!-- 3. Положение фона -->
    <div class="section-title">3. Положение и фильтр фона</div>
    <div class="card">
      <div class="slider-header"><span>Масштаб фона (Zoom):</span><span id="val-bg-zoom" class="slider-val">1.0x</span></div>
      <input type="range" id="bg-zoom" min="1.0" max="3.0" step="0.05" value="1.0" oninput="render()">

      <div class="slider-header"><span>Смещение фона X:</span><span id="val-bg-x" class="slider-val">0</span></div>
      <input type="range" id="bg-x" min="-600" max="600" step="10" value="0" oninput="render()">

      <div class="slider-header"><span>Смещение фона Y:</span><span id="val-bg-y" class="slider-val">0</span></div>
      <input type="range" id="bg-y" min="-800" max="800" step="10" value="0" oninput="render()">

      <div class="slider-header"><span>Яркость / затемнение:</span><span id="val-bg-dark" class="slider-val">85%</span></div>
      <input type="range" id="bg-dark" min="0.1" max="1.0" step="0.05" value="0.85" oninput="render()">
    </div>

    <!-- 4. Кнопки -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
      <button class="action-btn green" onclick="saveToTelegram()">🚀 Отправить карточку в чат (1080x1920)</button>
      <button class="action-btn secondary" onclick="downloadImage()">💾 Скачать на устройство</button>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const ALLOWED_USERS = [1536865093, 869401391];
    const userId = tg.initDataUnsafe?.user?.id || 1536865093;
    const STORAGE_KEY = `rune_settings_${userId}`;

    const RUNES_LIST = [
      "Феху", "Уруз", "Турисаз", "Ансуз", "Райдо", "Кеназ", "Гебо", "Вуньо",
      "Хагалаз", "Наутиз", "Иса", "Йера", "Эйваз", "Перт", "Альгиз", "Соулу",
      "Тейваз", "Беркана", "Эваз", "Манназ", "Лагуз", "Ингуз", "Дагаз", "Одал"
    ];

    if (userId && !ALLOWED_USERS.includes(userId)) {
      document.getElementById('auth-error').style.display = 'block';
    } else {
      document.getElementById('app-container').style.display = 'block';
    }

    let state = {
      runes: [
        { name: "Феху", ox: 0, oy: 0, scale: 1.0 },
        { name: "Уруз", ox: 0, oy: 0, scale: 1.0 },
        { name: "Турисаз", ox: 0, oy: 0, scale: 1.0 }
      ],
      bgUrlText: "",
      bgImage: null,
      zoom: 1.0,
      bgX: 0,
      bgY: 0,
      darkness: 0.85
    };

    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const loadedRuneImages = {};

    function loadSavedSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.runes)) {
            // Безопасное объединение с дефолтными значениями (защита от undefined)
            state.runes = parsed.runes.map((r, idx) => ({
              name: r && r.name ? r.name : (state.runes[idx]?.name || "Феху"),
              ox: typeof r?.ox === 'number' ? r.ox : 0,
              oy: typeof r?.oy === 'number' ? r.oy : 0,
              scale: typeof r?.scale === 'number' ? r.scale : 1.0
            }));
          }
          if (typeof parsed.zoom === 'number') state.zoom = parsed.zoom;
          if (typeof parsed.bgX === 'number') state.bgX = parsed.bgX;
          if (typeof parsed.bgY === 'number') state.bgY = parsed.bgY;
          if (typeof parsed.darkness === 'number') state.darkness = parsed.darkness;
          if (parsed.bgUrlText) {
            state.bgUrlText = parsed.bgUrlText;
            const bgInput = document.getElementById('bg-url');
            if (bgInput) bgInput.value = state.bgUrlText;
          }
        }
      } catch (e) {
        console.warn("Сброс поврежденных настроек:", e);
      }
    }

    function saveSettings() {
      try {
        const toSave = {
          runes: state.runes,
          zoom: state.zoom,
          bgX: state.bgX,
          bgY: state.bgY,
          darkness: state.darkness,
          bgUrlText: document.getElementById('bg-url') ? document.getElementById('bg-url').value.trim() : ""
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
        }
      } catch (e) {
        console.error("Ошибка сохранения настроек:", e);
      }
    }

    function syncInputsFromState() {
      const zoomEl = document.getElementById('bg-zoom');
      const xEl = document.getElementById('bg-x');
      const yEl = document.getElementById('bg-y');
      const darkEl = document.getElementById('bg-dark');

      if (zoomEl) zoomEl.value = state.zoom;
      if (xEl) xEl.value = state.bgX;
      if (yEl) yEl.value = state.bgY;
      if (darkEl) darkEl.value = state.darkness;
    }

    function renderTabsUI() {
      const wrapper = document.getElementById('rune-tabs-wrapper');
      if (!wrapper) return;

      wrapper.innerHTML = state.runes.map((r, i) => {
        const scaleVal = typeof r.scale === 'number' ? r.scale : 1.0;
        const oxVal = typeof r.ox === 'number' ? r.ox : 0;
        const oyVal = typeof r.oy === 'number' ? r.oy : 0;

        return `
          <div class="tab-content ${i === 0 ? 'active' : ''}" id="tab-${i}">
            <label>Выберите руну:</label>
            <select onchange="updateRuneName(${i}, this.value)">
              ${RUNES_LIST.map(name => `<option value="${name}" ${name === r.name ? 'selected' : ''}>${name}</option>`).join('')}
            </select>

            <div class="slider-header">
              <span>Масштаб руны:</span>
              <span class="slider-val" id="val-r-scale-${i}">${scaleVal.toFixed(2)}x</span>
            </div>
            <input type="range" min="0.4" max="2.0" step="0.05" value="${scaleVal}" id="r-scale-${i}" oninput="updateRuneScale(${i})">

            <div class="slider-header">
              <span>Смещение X (влево / вправо):</span>
              <span class="slider-val" id="val-r-ox-${i}">${oxVal}</span>
            </div>
            <input type="range" min="-400" max="400" step="5" value="${oxVal}" id="r-ox-${i}" oninput="updateRunePos(${i})">

            <div class="slider-header">
              <span>Смещение Y (вверх / вниз):</span>
              <span class="slider-val" id="val-r-oy-${i}">${oyVal}</span>
            </div>
            <input type="range" min="-400" max="400" step="5" value="${oyVal}" id="r-ox-${i}" oninput="updateRunePos(${i})">

            <button class="action-btn secondary" style="margin-top: 10px;" onclick="resetSingleRune(${i})">Сбросить эту руну</button>
          </div>
        `;
      }).join('');
    }

    function switchRuneTab(index) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
      document.querySelectorAll('.tab-content').forEach((tab, i) => tab.classList.toggle('active', i === index));
    }

    function updateRuneName(idx, val) { 
      state.runes[idx].name = val; 
      saveSettings();
      render(); 
    }

    function updateRuneScale(idx) {
      const el = document.getElementById(`r-scale-${idx}`);
      if (!el) return;
      const val = parseFloat(el.value) || 1.0;
      state.runes[idx].scale = val;
      const lbl = document.getElementById(`val-r-scale-${idx}`);
      if (lbl) lbl.innerText = val.toFixed(2) + "x";
      saveSettings();
      render();
    }

    function updateRunePos(idx) {
      const oxEl = document.getElementById(`r-ox-${idx}`);
      const oyEl = document.querySelectorAll(`#tab-${idx} input[type="range"]`)[2]; // 3-й ползунок
      
      const ox = oxEl ? parseInt(oxEl.value) || 0 : 0;
      const oy = oyEl ? parseInt(oyEl.value) || 0 : 0;

      state.runes[idx].ox = ox;
      state.runes[idx].oy = oy;

      const oxLbl = document.getElementById(`val-r-ox-${idx}`);
      const oyLbl = document.getElementById(`val-r-oy-${idx}`);
      if (oxLbl) oxLbl.innerText = ox;
      if (oyLbl) oyLbl.innerText = oy;

      saveSettings();
      render();
    }

    function resetSingleRune(idx) {
      state.runes[idx].ox = 0;
      state.runes[idx].oy = 0;
      state.runes[idx].scale = 1.0;
      renderTabsUI();
      saveSettings();
      render();
    }

    function resetAllRunes() {
      state.runes.forEach((_, idx) => {
        state.runes[idx].ox = 0;
        state.runes[idx].oy = 0;
        state.runes[idx].scale = 1.0;
      });
      renderTabsUI();
      saveSettings();
      render();
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => { state.bgImage = img; render(); };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateBgFromUrl() {
      const input = document.getElementById('bg-url');
      if (!input) return;
      const url = input.value.trim();
      if (!url) return;
      saveSettings();
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => { state.bgImage = img; render(); };
      img.src = url;
    }

    function loadRuneImage(name) {
      return new Promise((resolve) => {
        if (loadedRuneImages[name]) return resolve(loadedRuneImages[name]);
        const img = new Image();
        img.src = `runes/${encodeURIComponent(name)}.png`;
        img.onload = () => { loadedRuneImages[name] = img; resolve(img); };
        img.onerror = () => resolve(null);
      });
    }

    async function render() {
      const zoomEl = document.getElementById('bg-zoom');
      const xEl = document.getElementById('bg-x');
      const yEl = document.getElementById('bg-y');
      const darkEl = document.getElementById('bg-dark');

      if (zoomEl) state.zoom = parseFloat(zoomEl.value) || 1.0;
      if (xEl) state.bgX = parseInt(xEl.value) || 0;
      if (yEl) state.bgY = parseInt(yEl.value) || 0;
      if (darkEl) state.darkness = parseFloat(darkEl.value) || 0.85;

      const zLbl = document.getElementById('val-bg-zoom');
      const xLbl = document.getElementById('val-bg-x');
      const yLbl = document.getElementById('val-bg-y');
      const dLbl = document.getElementById('val-bg-dark');

      if (zLbl) zLbl.innerText = state.zoom.toFixed(2) + "x";
      if (xLbl) xLbl.innerText = state.bgX;
      if (yLbl) yLbl.innerText = state.bgY;
      if (dLbl) dLbl.innerText = Math.round(state.darkness * 100) + "%";

      ctx.fillStyle = "#19191e";
      ctx.fillRect(0, 0, 1080, 1920);

      // Отрисовка фона
      if (state.bgImage) {
        const img = state.bgImage;
        const ratio = Math.max(1080 / img.width, 1920 / img.height) * state.zoom;
        const newW = img.width * ratio;
        const newH = img.height * ratio;
        const pasteX = (1080 - newW) / 2 + state.bgX;
        const pasteY = (1920 - newH) / 2 + state.bgY;

        ctx.drawImage(img, pasteX, pasteY, newW, newH);

        if (state.darkness < 1.0) {
          ctx.fillStyle = `rgba(0, 0, 0, ${1.0 - state.darkness})`;
          ctx.fillRect(0, 0, 1080, 1920);
        }
      }

      // Отрисовка рун с индивидуальным масштабированием и центрированием
      const RUNE_BASE_SIZE = 460;
      const SPACING = 80;
      const totalRunesH = 3 * RUNE_BASE_SIZE + 2 * SPACING;
      const baseStartY = (1920 - totalRunesH) / 2;
      const baseX = (1080 - RUNE_BASE_SIZE) / 2;

      for (let i = 0; i < 3; i++) {
        const r = state.runes[i];
        if (!r || !r.name) continue;
        const img = await loadRuneImage(r.name);
        if (img) {
          const rScale = typeof r.scale === 'number' ? r.scale : 1.0;
          const targetBox = RUNE_BASE_SIZE * rScale;
          const ratio = Math.min(targetBox / img.width, targetBox / img.height);
          const drawW = img.width * ratio;
          const drawH = img.height * ratio;

          const centerX = baseX + RUNE_BASE_SIZE / 2 + (r.ox || 0);
          const centerY = baseStartY + i * (RUNE_BASE_SIZE + SPACING) + RUNE_BASE_SIZE / 2 + (r.oy || 0);

          const finalX = centerX - drawW / 2;
          const finalY = centerY - drawH / 2;

          ctx.drawImage(img, finalX, finalY, drawW, drawH);
        }
      }
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = `rune_card_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function saveToTelegram() {
      saveSettings();
      const payload = {
        r1: state.runes[0].name,
        r2: state.runes[1].name,
        r3: state.runes[2].name,
        p1: [state.runes[0].ox, state.runes[0].oy],
        p2: [state.runes[1].ox, state.runes[1].oy],
        p3: [state.runes[2].ox, state.runes[2].oy],
        s1: state.runes[0].scale,
        s2: state.runes[1].scale,
        s3: state.runes[2].scale,
        bg: document.getElementById('bg-url') ? document.getElementById('bg-url').value.trim() : "",
        z: state.zoom,
        ox: state.bgX,
        oy: state.bgY,
        d: state.darkness
      };
      tg.sendData(JSON.stringify(payload));
    }

    // Инициализация при старте
    function initApp() {
      loadSavedSettings();
      syncInputsFromState();
      renderTabsUI();
      if (state.bgUrlText) updateBgFromUrl();
      render();
    }

    initApp();
  </script>
</body>
</html>
